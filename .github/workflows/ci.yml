name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Install pnpm (version from `packageManager`) before setup-node, which caches the pnpm store.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

      # Scroll snapping differs per engine, so CI tests in all three.
      # vitest.config.ts runs every engine when CI is set.
      - run: pnpm --filter @mitchellslager/carousel exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test

      - run: pnpm build
      - run: pnpm check:package
      - run: pnpm size
