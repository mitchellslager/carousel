name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3

      # Only the dev-tooling group is merged automatically. `--auto` waits for
      # the required CI checks, so this needs auto-merge and branch protection
      # enabled on the repository.
      - if: steps.metadata.outputs.dependency-group == 'dev-tooling'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
